name: Archive daily RSI experiment

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "test-support/**"
      - "public/**"
      - "wrangler.jsonc"
      - "scripts/snapshot*.mjs"
      - "package*.json"
      - ".github/workflows/daily-evolution.yml"
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 8 * * *"
    - cron: "55 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rsi-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: snapshot
        run: npm run snapshot
      - name: Preserve diagnostics even when a task fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-evidence-${{ github.run_id }}
          path: snapshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit measured experiment or clearly labelled failure evidence
        if: always() && (steps.snapshot.outcome == 'success' || steps.snapshot.outcome == 'failure')
        run: |
          git config user.name "rsi-evolution-bot"
          git config user.email "rsi-evolution-bot@users.noreply.github.com"
          git add snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "experiment: archive RSI measurements and operational evidence"
            git pull --rebase
            git push
          fi
