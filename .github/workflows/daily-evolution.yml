name: Archive daily RSI experiment

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run snapshot
      - name: Commit measured experiment
        run: |
          git config user.name "rsi-evolution-bot"
          git config user.email "rsi-evolution-bot@users.noreply.github.com"
          git add snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "experiment: archive measured RSI run"
            git pull --rebase
            git push
          fi
